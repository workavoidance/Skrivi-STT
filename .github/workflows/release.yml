name: Windows release

on:
  push:
    branches: [main]
    paths:
      - "release/VERSION"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed release (main only)
        type: boolean
        default: false

concurrency:
  group: certum-release-signing
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        shell: powershell
        run: |
          $tag = (Get-Content release\VERSION -Raw).Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "release/VERSION must contain a tag such as v0.3.0."
          }
          "number=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate signing configuration
        shell: powershell
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          if (-not $env:CERTUM_USERNAME -or -not $env:CERTUM_OTP_URI -or -not $env:CERTUM_KEY_ID) {
            throw "All three CERTUM signing secrets are required."
          }
      - name: Build portable executable
        shell: powershell
        run: .\build_portable.ps1
      - name: Install installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Connect to Certum cloud certificate
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          capture-diagnostics: 'false'
      - name: Sign portable executable
        shell: powershell
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: .\tools\sign_windows.ps1 -Path dist\Skrivi.exe -Thumbprint $env:CERTUM_KEY_ID
      - name: Build per-user installer
        shell: powershell
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: .\build_installer.ps1 -Version "${{ steps.version.outputs.tag }}" -SigningThumbprint $env:CERTUM_KEY_ID
      - name: Verify all release signatures before packaging
        shell: powershell
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $installer = Get-Item "dist\installer\Skrivi-*-windows-x64-setup.exe"
          if (@($installer).Count -ne 1) { throw "Expected exactly one installer." }
          .\tools\sign_windows.ps1 -VerifyOnly -Thumbprint $env:CERTUM_KEY_ID -Path @("dist\Skrivi.exe", "dist\installed\Skrivi\Skrivi.exe", $installer.FullName)
      - name: Check signed installation and preserved user data
        shell: powershell
        env:
          SKRIVI_EXPECTED_SIGNER: ${{ secrets.CERTUM_KEY_ID }}
        run: .\tests\check_naming_installer.ps1
      - name: Package release
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $releaseDir = "build\release-package"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item dist\Skrivi.exe $releaseDir\
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md $releaseDir\
          $archive = "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash *$archive" | Set-Content "$archive.sha256"
          $installer = Get-Item "dist\installer\Skrivi-*-windows-x64-setup.exe"
          $publishedInstaller = "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64-setup.exe"
          Copy-Item $installer.FullName $publishedInstaller
          $installerHash = (Get-FileHash $publishedInstaller -Algorithm SHA256).Hash.ToLower()
          "$installerHash *$publishedInstaller" | Set-Content "$publishedInstaller.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: Skrivi-Snakk-${{ steps.version.outputs.number }}-windows-x64
          if-no-files-found: error
          path: |
            Skrivi-Snakk-${{ steps.version.outputs.number }}-windows-x64.zip
            Skrivi-Snakk-${{ steps.version.outputs.number }}-windows-x64.zip.sha256
            Skrivi-*-windows-x64-setup.exe
            Skrivi-*-windows-x64-setup.exe.sha256
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $assets = @(
            "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64.zip",
            "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64.zip.sha256",
            "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64-setup.exe",
            "Skrivi-Snakk-$($tag.TrimStart('v'))-windows-x64-setup.exe.sha256"
          )
          $notesFile = "docs/releases/$tag.md"
          $notesArgs = @("--generate-notes")
          if (Test-Path $notesFile) {
            $notesArgs = @("--notes-file", $notesFile)
          }
          $prereleaseArgs = @()
          if ($tag.StartsWith("v0.") -or $tag.Contains("-")) {
            $prereleaseArgs = @("--prerelease")
          }
          $originalErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "SilentlyContinue"
          & gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $originalErrorActionPreference
          if ($releaseExists) {
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed." }
            & gh release edit $tag --title "Skrivi Snakk $tag - Test release" @notesArgs @prereleaseArgs
          } else {
            & gh release create $tag @assets `
              --target "${{ github.sha }}" `
              --title "Skrivi Snakk $tag - Test release" `
              @notesArgs @prereleaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }

  store-package:
    # Store packaging is deliberately independent: GitHub releases remain
    # available immediately even if this job or Store certification is delayed.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        shell: powershell
        run: |
          $tag = (Get-Content release\VERSION -Raw).Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "release/VERSION must contain a tag such as v0.3.0."
          }
          "number=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build portable executable
        shell: powershell
        run: .\build_portable.ps1
      - name: Build unsigned Microsoft Store package
        shell: powershell
        run: >-
          .\build_store_msix.ps1
          -Version "${{ steps.version.outputs.tag }}"
          -StoreBuild "${{ github.run_number }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Skrivi-${{ steps.version.outputs.tag }}-Microsoft-Store
          path: dist/store/*.msix
          if-no-files-found: error

  publish-store-package:
    needs: [build, store-package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Skrivi-*-Microsoft-Store
          path: store-release
          merge-multiple: true
      - name: Attach Store submission package and checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content release\VERSION -Raw).Trim()
          $packages = @(Get-ChildItem store-release -Filter '*.msix')
          if ($packages.Count -ne 1) { throw "Expected exactly one Store package." }
          $package = $packages[0]
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash *$($package.Name)" | Set-Content "$($package.FullName).sha256"
          & gh release upload $tag $package.FullName "$($package.FullName).sha256"
          if ($LASTEXITCODE -ne 0) { throw "Store package upload failed." }

  submit-to-microsoft-store:
    needs: [build, store-package, publish-store-package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    uses: ./.github/workflows/store-submit.yml
    with:
      submit: true
    secrets:
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
