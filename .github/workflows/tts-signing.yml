name: Sign Skrivi TTS using existing Certum publisher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    uses: workavoidance/Skrivi-TTS/.github/workflows/signed-release.yml@90cf0f49358e8bd2456e424a6caee0da960d8deb
    with:
      source_ref: 90cf0f49358e8bd2456e424a6caee0da960d8deb
    secrets:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
