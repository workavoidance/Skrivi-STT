name: Sign Skrivi TTS using existing Certum publisher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    uses: workavoidance/Skrivi-TTS/.github/workflows/signed-release.yml@dd4721c17ec253b6dfcf8c3a86fa675bc03a6a92
    with:
      source_ref: dd4721c17ec253b6dfcf8c3a86fa675bc03a6a92
    secrets:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
