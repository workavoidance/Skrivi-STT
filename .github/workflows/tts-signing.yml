name: Sign Skrivi TTS using existing Certum publisher
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: TTS branch or commit (main builds current code)
        required: true
        default: main
permissions:
  contents: read
jobs:
  tts:
    uses: workavoidance/Skrivi-TTS/.github/workflows/signed-release.yml@28ffc132e8d82aaa1fff36fc4380ba4cde60e892
    with:
      source_ref: ${{ inputs.source_ref }}
    secrets:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
